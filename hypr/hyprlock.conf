# Base hyprlock config — ~/.config/hypr/hyprlock.conf
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

source = ~/.config/hypr/colors.lua

general {
    hide_cursor = false
    disable_loading_bar = false
}

# Uses a live screenshot of your desktop at the moment you lock,
# blurred, instead of a fixed wallpaper path. Always matches whatever
# wallpaper is currently active without needing to update this file.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
}

# Password input box
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(151515)
    inner_color = rgb(20, 20, 20)
    font_color = rgb(230, 230, 230)
    fade_on_empty = false
    placeholder_text = <i></i>
    hide_input = false
    rounding = 20
    check_color = rgb(136, 192, 208)
    fail_color = rgb(255, 0, 0)
    fail_text = <i>Try again ($ATTEMPTS)</i>
    position = 0, -40
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = VictorMono Nerd Font
    color = $primary
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_size = 22
    font_family = VictorMono Nerd Font
    color = rgba(255, 255, 255, 0.7)
    position = 0, 90
    halign = center
    valign = center
}
